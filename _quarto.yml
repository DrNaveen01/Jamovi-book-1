project:
  type: book
  output-dir: docs

engine: knitr
book:
  title: "Hands-On Data Analysis Using Jamovi"
  subtitle: "Foundations and Core Statistical Methods for Health Researchers"
  author: "Dr Naveen Suthar"
  date: "2026-03-26"
  draft-mode: visible
  chapters:
    - index.qmd
    - part: foundations.qmd
      chapters: 
        - role.qmd
        - getting-started.qmd
        - data-management.qmd
    - part: descriptive.qmd
      chapters: 
        - descriptive-statistics.qmd
        - graphical-presentation.qmd
    - part: inferential.qmd
      chapters: 
        - hypothesis-testing-concepts.qmd
        - comparing-two-means.qmd
        - comparing-more-than-two-means.qmd
        - categorical-variables.qmd
    - part: regression.qmd
      chapters: 
        - correlation.qmd
        - linear-regression.qmd
        - logistic-regression.qmd
    - part: reporting.qmd
      chapters: 
        - reporting-results.qmd
    - references.qmd
  appendices: 
    - statistical-formulas.qmd
    - choosing-right-test.qmd
    - glossary.qmd
    - practice-dataset-excercises.qmd

  announcement: This work is in part of a project to write a companion to data analysis using Jamovi software for medical professionals.
  bread-crumbs: true
  volume: 1
  volume-title: First book of the series
  status: forthcoming
  publisher-place: "Patna, India"
  reader-mode: true
  number-of-volumes: 3
  downloads: pdf
  
bibliography: references.bib
toc: true
toc-expand: true
toc-depth: 2
lof: true
lot: true
date-format: "D MMMM YYYY"
number-sections: true
fig-height: 5
fig-width: 8
execute: 
  echo: false
  warning: false
format:
  html:
    theme: cosmo
    fontsize: 16px
    mainfont: "Merriweather, serif"
    code-link: true
    toc-title: "<b>Sections</b>"
    html-math-method: katex
    published-title: "Last updated"
    include-in-header:
      file: fonts.html
  pdf:
    documentclass: book
    classoption: oneside
    pdf-engine: xelatex
    fig-align: center
    zotero: true
    
    
  


